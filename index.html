<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<!-- css -->
	<link rel="stylesheet" type="text/css" href="./Base/css/IU.css" media="screen" />
	<!-- clases generales -->
	<script type="text/javascript" src="./Core/Validations_Class.js"></script>
	<script type="text/javascript" src="./Core/ExternalAccess_class.js"></script>
	<!-- clases dom -->
	<script type="text/javascript" src="./Core/Dom_table_Class.js"></script>
	<script type="text/javascript" src="./Core/Dom_Class.js"></script>
	<!-- clases entidades -->
	<script type="text/javascript" src="./app/persona/persona_Class.js"></script>
	<script type="text/javascript" src="./app/usuario/usuario_Class.js"></script>
	<script type="text/javascript" src="./app/funcionalidad_accion/funcionalidad_accion_Class.js"></script>
	<script type="text/javascript" src="./app/rol/rol_Class.js"></script>
	<script type="text/javascript" src="./app/accion/accion_Class.js"></script>


	<!-- este es el script que carga las librerias ajax que usamos para acceder al back -->
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>


</head>

<body>

	<header id='header_page' class='bordeado'>texto titulo aplicación</header>
	<nav class='bordeado'><span onclick="menu_work();">Opciones de ménu</span>
	</nav>
	<aside id='div-menu'>
		<ol>
		    <li class="opcionmenu"><span onclick="entidad = new persona();">Gestionar persona</span></li>
			<li class="opcionmenu"><span onclick="entidad = new usuario();">Gestionar usuario</span></li>
			<li class="opcionmenu"><span onclick="entidad = new funcionalidad_accion();">Gestionar funcionalidad_accion</span></li>
			<li class="opcionmenu"><span onclick="entidad = new rol();">Gestionar rol</span></li>
			<li class="opcionmenu"><span onclick="entidad = new accion();">Gestionar accion</span></li>

			<!--Añadir resto de clases-->

		    <li class="opcionmenu"><span onclick="entidad = new entidad();">Gestionar otra entidad</span></li>
			
	  	</ol>
	</aside>
	<section id="IU_manage_entity">
		<section id="IU_manage_head">
			<div id='title_page' class='bordeado'><span id = "text_title_page" class="">titulo de pagina de entidad</span>
			</div>
			<div id="add_search_columns">
        		<img id="botonADD" src="./iconos/ADD.png" onclick="entidad.createForm_ADD();" />
        		<img id="botonSEARCH" src="./iconos/SEARCH.png" onclick="entidad.createForm_SEARCH();"/>

				<!--Preguntar rodeiro si es esto(qué llama el test) 
				y donde colocar imagen(al lado de add o en titulo)-->

				<img id="botonTEST" src="./iconos/TEST.png" onclick="window.open('./Test/Data/index.html?entidad=' + entidad.nombreentidad, '_blank');" />
				
				<label id="label_seleccioncolumnas">Columnas</label>
				<select id="seleccioncolumnas" multiple>
				</select>
				
        	</div>
		</section>

		<section id="IU_manage_table">

		</section>

	</section>
	<section id="IU_form" class='bordeado'>
		
	</section>

	<article class='bordeado'>Sección article</article>

	<footer class='bordeado'>Pie de página</footer>
	
	<script type="text/javascript">
		document.getElementById('div-menu').style.display = 'none';
		document.getElementById('IU_form').style.display = 'none';
		document.getElementById('IU_manage_entity').style.display = 'none';
		
		/*	hide the text error box if is necessary	
		document.getElementById('span_error_name').style.display = 'none';
		*/
		function menu_work(){
			if (document.getElementById('div-menu').style.display == 'none'){
				document.getElementById('div-menu').style.display = 'block';
			}
			else{
				document.getElementById('div-menu').style.display = 'none';
			}
		}
	</script>

</body>


</html>
